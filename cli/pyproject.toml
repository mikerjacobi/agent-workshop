[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mothership-cli"
version = "0.1.0"
description = "The mothership CLI used by the agent workshop."
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.11.0",
    "click>=8.1.0",
    "httpx>=0.27",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.7.0",
    "websockets>=14.0",
]

[project.scripts]
mothership = "mothership_cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mothership_cli" = ["py.typed"]
