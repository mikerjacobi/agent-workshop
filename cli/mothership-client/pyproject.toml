[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mothership-client"
version = "0.6.0"
description = "Mothership wire contract and REST client: the pydantic models both the server and every client validate with, plus MothershipClient."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27",
    "websockets>=14.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# PEP 561 marker so type checkers read these annotations instead of treating
# every model as Any. Added for the workshop; not present upstream.
"mothership_client" = ["py.typed"]
