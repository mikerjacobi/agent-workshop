[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mothership-cli"
version = "0.6.0"
description = "Mothership CLI: agent, sandbox, thread, and eval operations against the platform API."
requires-python = ">=3.12"
dependencies = [
    "mothership-client",
    "aiohttp>=3.11.0",
    "click>=8.1.0",
    "httpx>=0.27",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.7.0",
    "websockets>=14.0",
]

[project.optional-dependencies]
# Harbor is the schema authority for eval interchange: `evals run-local`
# invokes it and parses its job dirs through its own pinned models. The
# workshop runs evals on the platform executor instead, so this stays an
# extra — everything except `evals run-local` works without it.
local-runner = ["harbor==0.16.1"]

[project.scripts]
mothership = "mothership_cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# PEP 561 marker so type checkers read these annotations instead of treating
# every model as Any. Added for the workshop; not present upstream.
"mothership_cli" = ["py.typed"]
